[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
# Linux CI provides x86_64-unknown-linux-gnu by default.
# Windows/macOS dev: no extra targets required for M0.
# If rustup reports a partially installed 1.99.1 toolchain, run:
#   rustup toolchain uninstall 1.99.1; rustup toolchain install 1.99.1 --component rustfmt,clippy
